name: Get Branches

on:
  workflow_dispatch:

jobs:
  get-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Get Branches
        run: |
          BRANCHES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                     "https://api.github.com/repos/${{ github.repository }}/branches" \
                     | jq -r '.[].name')
          echo "$BRANCHES"
